<div class="content">
  <!-- No `navbar-expand-lg`: it pins the bar to one non-wrapping line, and with
       no `navbar-toggler` to go with it the brand and the version text were
       crushed together on a small screen. Letting the bar wrap costs nothing on
       desktop (it only wraps when it has to) and fixes the small end. -->
  <nav class="navbar navbar-dark bg-dark py-0 mb-3" [hidden]="mode === 'player'">
    <div class="container-fluid gap-2">
      <a class="navbar-brand" rel="home" href="#" title="BattleTracker">
        <img class="navbar-logo" src="assets/logo.svg" alt="BattleTracker Logo">
      </a>
      <a id="navbar-title" class="navbar-brand" href="#">BattleTracker</a>
      <ul class="navbar-nav me-auto mb-2 mb-lg-0"></ul>
      <div class="d-flex align-items-center flex-wrap gap-2">
        <span class="navbar-text">Version: {{ versionService.version }}</span>
        <!--<li *ngIf="!auth.authenticated()">
    <a href="#" (click)="auth.login()"><i class="fa fa-sign-in-alt fa-lg fa-inverse"></i> Login</a>
  </li>
  <li *ngIf="auth.authenticated()">
    <a href="#" (click)="auth.logout()"><i class="fa fa-sign-out-alt fa-lg fa-inverse"></i> Logout</a>
  </li>-->
      </div>
    </div>
  </nav>
  <div class="container-fluid">
    @if (mode === "player") {
    <app-player-view></app-player-view>
    }
    @else {
    <app-battle-tracker></app-battle-tracker>
    }
  </div>
</div>

<div class="footer" [hidden]="mode === 'player'">
  <span>
    BattleTracker - made by <a href="https://github.com/MerGatto/BattleTracker">MerGatto</a>.
  </span>
</div>
