<div class="mgn-container" [class.mgn-in-host]="insideHost">

  <!-- ── Header bar ──────────────────────────────────────────────────── -->
  <div class="mgn-header">
    @if (insideHost) {
    <span class="mgn-location-badge mgn-inside-host">
      <i class="fas fa-server me-1"></i>Inside: {{ hostLabel }}
    </span>
    } @else {
    <span class="mgn-location-badge mgn-public-space">
      <i class="fas fa-globe me-1"></i>Public Space
    </span>
    }
    @if (gmMode) {
    <span class="mgn-gm-badge">GM VIEW</span>
    }
  </div>

  <!-- ── SVG canvas ──────────────────────────────────────────────────── -->
  @if (isEmpty) {
  <div class="mgn-empty">
    <i class="fas fa-project-diagram mgn-empty-icon"></i>
    <span>No Matrix icons in this space.</span>
  </div>
  } @else {
  <svg class="mgn-svg"
    [attr.width]="svgW"
    [attr.height]="svgH"
    [attr.viewBox]="'0 0 ' + svgW + ' ' + svgH">

    <!-- ── Background grid ─────────────────────────────────────────── -->
    <defs>
      <pattern id="mgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,200,160,0.06)" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect [attr.width]="svgW" [attr.height]="svgH" fill="url(#mgGrid)"/>

    <!-- ── Host label (inside-host view) ───────────────────────────── -->
    @if (insideHost) {
    <text class="mgn-canvas-host-label" [attr.x]="svgW / 2" y="20" text-anchor="middle">
      {{ hostLabel }}
    </text>
    }

    <!-- ── Edges (Decision 3) — drawn before nodes so nodes paint on top ── -->
    @for (edge of edges; track edge.fromId + '->' + edge.toId) {
    <line class="mgn-edge"
      [attr.x1]="nodeById(edge.fromId)?.x ?? 0" [attr.y1]="nodeById(edge.fromId)?.y ?? 0"
      [attr.x2]="nodeById(edge.toId)?.x ?? 0" [attr.y2]="nodeById(edge.toId)?.y ?? 0"/>
    }

    <!-- ── Nodes ───────────────────────────────────────────────────── -->
    @for (node of displayNodes; track node.id) {
    <g [attr.class]="nodeGroupClass(node)"
       [attr.transform]="'translate(' + node.x + ',' + node.y + ')'">

      <!-- Node body -->
      <circle [attr.r]="nodeRadius(node)" class="mgn-node-body"/>

      <!-- Symbol / icon text -->
      <text class="mgn-node-symbol" text-anchor="middle" dominant-baseline="central">
        {{ nodeSymbol(node) }}
      </text>

      <!-- Direct-connection plug overlay. Dead pending the direct-connection
           workflow (Decision 7, briefs/matrix-graph-readability-spec.md):
           GM mode never sets `node.directConnection`, so this never renders
           today. Left as-is on purpose — do not wire it from
           `MatrixHost.accessMethod`, a host-level fact, as if it were a
           per-icon one (SQ-3). -->
      @if (node.directConnection) {
      <text class="mgn-dc-overlay" x="14" y="-14" text-anchor="middle" font-size="10">⚡</text>
      }

      <!-- GM visibility badge -->
      @if (gmMode) {
      <text class="mgn-vis-badge" [attr.x]="visBadgeX(node)" [attr.y]="visBadgeY(node)"
        text-anchor="middle">
        {{ visBadge(node) }}
      </text>
      }

      <!-- Name label -->
      @if (node.visibility !== 'running-silent' || gmMode) {
      <text class="mgn-node-label" [attr.y]="nodeLabelY(node)"
        text-anchor="middle">
        {{ node.label }}
      </text>
      } @else {
      <text class="mgn-node-label mgn-label-ghost" [attr.y]="nodeLabelY(node)"
        text-anchor="middle">■ Unknown</text>
      }

      <!-- Sub-label (type / visibility) -->
      @if (node.subLabel) {
      <text class="mgn-node-sublabel" [attr.y]="nodeSubLabelY(node)"
        text-anchor="middle">
        {{ node.subLabel }}
      </text>
      }

      <!-- Mark rows — one per decker holding a mark on this icon (§4). -->
      @for (row of markRows(node.marks); track row.owner; let i = $index) {
      <text class="mgn-mark-row" [attr.y]="markRowY(node, i)"
        text-anchor="middle">
        {{ markRowText(row) }}
      </text>
      }

    </g>
    }

  </svg>
  }

  <!-- ── Legend ──────────────────────────────────────────────────────── -->
  <div class="mgn-legend">
    <span class="mgn-leg mgn-leg-persona-me">◉ Decker</span>
    <span class="mgn-leg mgn-leg-host">⬛ Host</span>
    <span class="mgn-leg mgn-leg-device">⬡ Device</span>
    <span class="mgn-leg mgn-leg-file">▣ File</span>
    <span class="mgn-leg mgn-leg-ic">◆ IC</span>
    <span class="mgn-leg mgn-leg-unknown">■ Unknown</span>
    <span class="mgn-leg mgn-leg-marks">●●○ = marks (per decker)</span>
    @if (gmMode) {
    <span class="mgn-leg">👁=Active 👻=Silent ✕=Hidden</span>
    }
  </div>

</div>
