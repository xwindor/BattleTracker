<!-- The VR mode chip moved to the initiative row, beside the name (GM screen
     overhaul 07, GitHub #10); the VR CATATONIC chip was dropped, since Hot or
     Cold Sim already says the body is out of action (Xavier, 2026-10-04). The
     Overwatch adjuster stays here, in the Deck tab (Xavier, 2026-10-03). -->
<div class="matrix-badge" *ngIf="participant">
  <span class="os-chip-wrap">
    <button
      type="button"
      class="os-chip"
      [ngClass]="'os-' + osTier"
      (click)="onOsChipClick($event)"
      [title]="'OS ' + participant.overwatch + ' — click to adjust'">
      OS&nbsp;{{ participant.overwatch }}
    </button>

    <span *ngIf="osEditorOpen" class="os-editor" (click)="$event.stopPropagation()">
      <button type="button" class="os-adj-btn" (click)="onOsAdjust(-5, $event)" title="-5 OS">&minus;5</button>
      <button type="button" class="os-adj-btn" (click)="onOsAdjust(-1, $event)" title="-1 OS">&minus;1</button>
      <button type="button" class="os-adj-btn os-adj-pos" (click)="onOsAdjust(1, $event)" title="+1 OS">+1</button>
      <button type="button" class="os-adj-btn os-adj-pos" (click)="onOsAdjust(5, $event)" title="+5 OS">+5</button>
      <button type="button" class="os-adj-btn os-adj-reset" (click)="onOsResetClick($event)" title="Reset OS to 0">Reset</button>
    </span>
  </span>
</div>
